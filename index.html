<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>حدیثه سلطانی | Hadiyeh Soltani</title>
  <meta name="description" content="رزومه حدیثه سلطانی — کارشناس مهندسی شهرسازی، کارشناس ارشد مهندسی صنایع، گرافیست و تولیدکننده محتوا" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f6f3ee;
      --surface: rgba(255, 255, 255, 0.78);
      --surface-strong: rgba(255, 255, 255, 0.94);
      --ink: #101827;
      --muted: #5d6675;
      --brand: #0f766e;
      --brand-2: #c2410c;
      --gold: #d97706;
      --line: rgba(15, 23, 42, 0.10);
      --shadow: 0 24px 80px rgba(15, 23, 42, 0.13);
      --shadow-soft: 0 12px 34px rgba(15, 23, 42, 0.08);
      --radius: 28px;
      --radius-sm: 18px;
      --font-fa: "Vazirmatn", Tahoma, sans-serif;
      --font-en: "Inter", Arial, sans-serif;
    }

    html[data-theme="dark"] {
      --bg: #0b1120;
      --surface: rgba(15, 23, 42, 0.72);
      --surface-strong: rgba(15, 23, 42, 0.92);
      --ink: #f8fafc;
      --muted: #b6c0cf;
      --brand: #2dd4bf;
      --brand-2: #fb923c;
      --gold: #fbbf24;
      --line: rgba(255, 255, 255, 0.12);
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.38);
      --shadow-soft: 0 12px 34px rgba(0, 0, 0, 0.24);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--bg);
      font-family: var(--font-fa);
      overflow-x: hidden;
      transition: background .35s ease, color .35s ease;
    }

    html[lang="en"] body { font-family: var(--font-en); }

    button, a { -webkit-tap-highlight-color: transparent; }

    button { font: inherit; }

    [hidden] { display: none !important; }

    .animated-bg {
      position: fixed;
      inset: 0;
      z-index: -2;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 10%, rgba(15, 118, 110, .18), transparent 32%),
        radial-gradient(circle at 86% 18%, rgba(194, 65, 12, .15), transparent 30%),
        radial-gradient(circle at 50% 92%, rgba(217, 119, 6, .13), transparent 35%),
        linear-gradient(135deg, var(--bg), var(--bg));
    }

    .grid-overlay {
      position: absolute;
      inset: 0;
      opacity: .42;
      background-image:
        linear-gradient(to right, var(--line) 1px, transparent 1px),
        linear-gradient(to bottom, var(--line) 1px, transparent 1px);
      background-size: 56px 56px;
      mask-image: linear-gradient(to bottom, black, transparent 82%);
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(18px);
      opacity: .55;
      animation: floatOrb 16s ease-in-out infinite alternate;
    }

    .orb-a {
      width: 360px; height: 360px;
      top: -90px; right: -60px;
      background: radial-gradient(circle, rgba(15, 118, 110, .48), transparent 65%);
    }

    .orb-b {
      width: 420px; height: 420px;
      bottom: -160px; left: -100px;
      background: radial-gradient(circle, rgba(194, 65, 12, .40), transparent 65%);
      animation-delay: -4s;
    }

    .orb-c {
      width: 280px; height: 280px;
      top: 42%; left: 48%;
      background: radial-gradient(circle, rgba(217, 119, 6, .34), transparent 65%);
      animation-delay: -8s;
    }

    @keyframes floatOrb {
      0% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(26px, -32px, 0) scale(1.08); }
      100% { transform: translate3d(-18px, 22px, 0) scale(.96); }
    }

    @media (prefers-reduced-motion: reduce) {
      .orb { animation: none; }
      * { scroll-behavior: auto !important; }
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px clamp(18px, 5vw, 54px);
      background: linear-gradient(to bottom, color-mix(in srgb, var(--bg) 82%, transparent), transparent);
      backdrop-filter: blur(16px);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 46px;
      height: 46px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      font-family: var(--font-en);
      font-weight: 800;
      letter-spacing: -.05em;
      cursor: pointer;
      box-shadow: var(--shadow-soft);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon-btn, .ghost-btn {
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      border-radius: 999px;
      padding: 10px 14px;
      cursor: pointer;
      box-shadow: var(--shadow-soft);
      transition: transform .2s ease, background .2s ease, border-color .2s ease;
    }

    .icon-btn:hover, .ghost-btn:hover, .brand:hover {
      transform: translateY(-2px);
      border-color: color-mix(in srgb, var(--brand) 40%, var(--line));
    }

    .icon-btn {
      min-width: 46px;
      font-family: var(--font-en);
      font-weight: 700;
    }

    main {
      width: min(1180px, calc(100% - 28px));
      margin: 0 auto;
      padding: 16px 0 72px;
    }

    .landing {
      min-height: calc(100vh - 110px);
      display: grid;
      place-items: center;
      padding: 18px 0 42px;
    }

    .hero-card {
      width: 100%;
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: clamp(22px, 4vw, 48px);
      align-items: center;
      padding: clamp(24px, 5vw, 54px);
      border: 1px solid var(--line);
      border-radius: calc(var(--radius) + 8px);
      background: var(--surface);
      box-shadow: var(--shadow);
      backdrop-filter: blur(22px);
      position: relative;
      overflow: hidden;
    }

    .hero-card::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(120deg, transparent 0 35%, rgba(255,255,255,.25) 50%, transparent 65%);
      transform: translateX(-120%);
      animation: sheen 7s ease-in-out infinite;
    }

    @keyframes sheen {
      0%, 60% { transform: translateX(-120%); }
      100% { transform: translateX(120%); }
    }

    .avatar-wrap {
      position: relative;
      width: min(260px, 70vw);
      aspect-ratio: 1;
      margin: 0 auto;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 30% 20%, rgba(255,255,255,.9), transparent 38%),
        linear-gradient(145deg, color-mix(in srgb, var(--brand) 30%, white), color-mix(in srgb, var(--brand-2) 26%, white));
      box-shadow: 0 20px 60px rgba(15, 118, 110, .22), inset 0 0 0 1px rgba(255,255,255,.42);
      overflow: hidden;
    }

    .avatar-wrap img {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    .avatar-wrap .initials {
      position: absolute;
      z-index: 1;
      font-family: var(--font-en);
      font-size: 3rem;
      font-weight: 800;
      color: rgba(15, 23, 42, .42);
      letter-spacing: -.08em;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 12px;
      color: var(--brand);
      font-size: .82rem;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
      font-family: var(--font-en);
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 4.6vw, 4rem);
      line-height: 1.08;
      letter-spacing: -.04em;
    }

    .hero-title {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: clamp(.95rem, 1.7vw, 1.14rem);
      line-height: 1.9;
      max-width: 680px;
    }

    .hero-short {
      margin: 18px 0 0;
      font-size: clamp(1rem, 1.7vw, 1.16rem);
      line-height: 2;
      max-width: 720px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 22px;
    }

    .chip, .pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 1px solid var(--line);
      background: color-mix(in srgb, var(--surface-strong) 80%, transparent);
      color: var(--ink);
      border-radius: 999px;
      padding: 9px 13px;
      font-size: .88rem;
      line-height: 1.4;
      box-shadow: var(--shadow-soft);
    }

    .choice-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin-top: 30px;
    }

    .choice-card {
      position: relative;
      overflow: hidden;
      text-align: start;
      border: 1px solid var(--line);
      background: var(--surface-strong);
      color: var(--ink);
      border-radius: var(--radius-sm);
      padding: 22px;
      cursor: pointer;
      box-shadow: var(--shadow-soft);
      transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
    }

    .choice-card::after {
      content: "→";
      position: absolute;
      inset-inline-end: 18px;
      inset-block-start: 18px;
      font-family: var(--font-en);
      font-weight: 800;
      color: var(--brand);
      transition: transform .25s ease;
    }

    html[dir="rtl"] .choice-card::after { content: "←"; }

    .choice-card:hover {
      transform: translateY(-5px);
      border-color: color-mix(in srgb, var(--brand) 42%, var(--line));
      box-shadow: 0 24px 60px rgba(15, 118, 110, .18);
    }

    .choice-card:hover::after { transform: translateX(5px); }
    html[dir="rtl"] .choice-card:hover::after { transform: translateX(-5px); }

    .choice-icon {
      display: inline-grid;
      place-items: center;
      width: 46px;
      height: 46px;
      border-radius: 16px;
      background: color-mix(in srgb, var(--brand) 14%, transparent);
      font-size: 1.35rem;
      margin-bottom: 16px;
    }

    .choice-card h3 {
      margin: 0 0 8px;
      font-size: 1.12rem;
    }

    .choice-card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.85;
      font-size: .92rem;
    }

    .back-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 4px 0 18px;
      flex-wrap: wrap;
    }

    .resume-hero {
      display: grid;
      grid-template-columns: 130px 1fr auto;
      gap: 22px;
      align-items: center;
      padding: clamp(20px, 3vw, 32px);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
      backdrop-filter: blur(22px);
    }

    .avatar-sm {
      width: 130px;
      height: 130px;
      border-radius: 32px;
      overflow: hidden;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, color-mix(in srgb, var(--brand) 20%, white), color-mix(in srgb, var(--brand-2) 18%, white));
      box-shadow: var(--shadow-soft);
    }

    .avatar-sm img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .resume-hero h1 { font-size: clamp(1.7rem, 3.4vw, 2.8rem); }

    .resume-hero .hero-title { margin-top: 8px; }

    .contact-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }

    .contact-chips a, .contact-chips span {
      color: var(--ink);
      text-decoration: none;
      border: 1px solid var(--line);
      background: var(--surface-strong);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: .84rem;
      box-shadow: var(--shadow-soft);
    }

    .hero-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: stretch;
    }

    .primary-btn, .secondary-btn {
      border: 1px solid transparent;
      border-radius: 999px;
      padding: 11px 16px;
      cursor: pointer;
      font-weight: 700;
      white-space: nowrap;
      transition: transform .2s ease, background .2s ease;
    }

    .primary-btn {
      background: linear-gradient(135deg, var(--brand), color-mix(in srgb, var(--brand) 60%, #0ea5e9));
      color: #fff;
      box-shadow: 0 14px 34px rgba(15, 118, 110, .26);
    }

    .secondary-btn {
      background: var(--surface-strong);
      color: var(--ink);
      border-color: var(--line);
      box-shadow: var(--shadow-soft);
    }

    .primary-btn:hover, .secondary-btn:hover { transform: translateY(-2px); }

    .resume-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.55fr) minmax(280px, .82fr);
      gap: 20px;
      margin-top: 20px;
      align-items: start;
    }

    .resume-main, .resume-side {
      display: grid;
      gap: 18px;
    }

    .section-card {
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: var(--radius-sm);
      padding: clamp(18px, 2.7vw, 28px);
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(18px);
      break-inside: avoid;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 18px;
      font-size: 1.06rem;
      line-height: 1.6;
    }

    .section-icon {
      display: inline-grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: color-mix(in srgb, var(--brand) 12%, transparent);
      font-size: 1rem;
      flex: 0 0 auto;
    }

    .section-body { color: var(--ink); }

    .section-body p {
      margin: 0 0 12px;
      color: var(--muted);
      line-height: 2;
    }

    .section-body p:last-child { margin-bottom: 0; }

    .timeline {
      display: grid;
      gap: 16px;
    }

    .timeline-item {
      border-inline-start: 3px solid color-mix(in srgb, var(--brand) 40%, var(--line));
      padding-inline-start: 16px;
      padding-bottom: 2px;
    }

    .item-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 6px;
    }

    .item-head strong {
      font-size: .98rem;
      line-height: 1.6;
    }

    .meta {
      color: var(--brand);
      font-size: .8rem;
      line-height: 1.6;
      font-weight: 600;
    }

    .timeline-item ul, .clean-list {
      margin: 8px 0 0;
      padding-inline-start: 18px;
      color: var(--muted);
      line-height: 1.95;
      font-size: .91rem;
    }

    .timeline-item li, .clean-list li { margin-bottom: 4px; }

    .two-col {
      columns: 2;
      column-gap: 28px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .info-grid > div {
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: color-mix(in srgb, var(--surface-strong) 76%, transparent);
    }

    .info-grid span {
      display: block;
      color: var(--muted);
      font-size: .76rem;
      margin-bottom: 4px;
    }

    .info-grid strong {
      font-size: .9rem;
      line-height: 1.6;
    }

    .skill-list {
      display: grid;
      gap: 9px;
    }

    .skill-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 0;
      border-bottom: 1px dashed var(--line);
      font-size: .88rem;
    }

    .skill-row:last-child { border-bottom: 0; }

    .level {
      color: var(--brand);
      font-weight: 700;
      font-size: .78rem;
      white-space: nowrap;
    }

    .pill-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .pill {
      box-shadow: none;
      font-size: .82rem;
      padding: 7px 10px;
    }

    .inline-link {
      color: var(--brand);
      font-weight: 700;
      text-decoration: none;
      border-bottom: 1px dashed currentColor;
    }

    .note {
      font-size: .82rem !important;
      color: var(--muted);
      background: color-mix(in srgb, var(--gold) 10%, transparent);
      border: 1px dashed color-mix(in srgb, var(--gold) 38%, var(--line));
      border-radius: 14px;
      padding: 12px;
    }

    .motivation p {
      color: var(--ink);
      line-height: 2.1;
      font-size: .94rem;
    }

    .motivation strong { color: var(--brand); }

    .course-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .course {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 11px 12px;
      background: color-mix(in srgb, var(--surface-strong) 70%, transparent);
      font-size: .86rem;
      line-height: 1.7;
    }

    .course small {
      display: block;
      color: var(--muted);
      font-size: .74rem;
      margin-top: 3px;
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: .8rem;
      padding: 24px 0 0;
    }

    @media (max-width: 900px) {
      .hero-card {
        grid-template-columns: 1fr;
        text-align: center;
      }

      .hero-card .chips, .hero-card .choice-grid { justify-content: center; }
      .choice-card { text-align: start; }
      .resume-hero { grid-template-columns: 1fr; text-align: center; }
      .avatar-sm { margin: 0 auto; }
      .contact-chips { justify-content: center; }
      .hero-actions { flex-direction: row; flex-wrap: wrap; justify-content: center; }
      .resume-layout { grid-template-columns: 1fr; }
    }

    @media (max-width: 620px) {
      .choice-grid, .course-grid, .info-grid, .two-col { grid-template-columns: 1fr; columns: 1; }
      .resume-hero { padding: 20px; }
      .avatar-sm { width: 110px; height: 110px; border-radius: 28px; }
      .section-card { padding: 18px; }
      .item-head { display: block; }
      .meta { display: block; margin-top: 4px; }
    }

    @media print {
      .animated-bg, .site-header, .hero-actions, .back-row, footer { display: none !important; }
      body { background: #fff !important; color: #111 !important; }
      main { width: 100%; padding: 0; }
      .resume-hero, .section-card {
        box-shadow: none !important;
        background: #fff !important;
        border: 1px solid #ddd !important;
      }
      .resume-layout { display: block; }
      .section-card { margin-bottom: 12px; page-break-inside: avoid; }
    }
  </style>
</head>

<body>
  <div class="animated-bg" aria-hidden="true">
    <div class="grid-overlay"></div>
    <span class="orb orb-a"></span>
    <span class="orb orb-b"></span>
    <span class="orb orb-c"></span>
  </div>

  <header class="site-header">
    <button class="brand" type="button" onclick="goHome()" aria-label="Home">HS</button>
    <nav class="nav-actions" aria-label="Site controls">
      <button class="icon-btn" id="langBtn" type="button">EN</button>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="Toggle theme">🌙</button>
      <button class="ghost-btn" id="homeBtn" type="button" hidden>خانه</button>
    </nav>
  </header>

  <main id="app"></main>

  <script>
    /* =========================
       State
    ========================= */
    const state = {
      lang: localStorage.getItem("cv-lang") || "fa",

      view: "landing",
      mode: null
    };

    /* =========================
       UI labels

        viewAcademic: "مشاهده رزومه آکادمیک",

      },
      en: {

        academic: "Academic CV",

        academicDesc: "Education, research, courses, and academic motivation letter",
        industryDesc: "Work experience, achievements, and industry motivation letter",
        choose: "Choose a path",
        resume: "Resume",
        switchMode: "Switch CV",
        present: "Present",
        contact: "Contact",
        age: "Age",
        gender: "Gender",
        marital: "Marital status",
        email: "Email",

    }

    function openResume(mode) {
      state.view = "resume";
      state.mode = mode;
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function switchMode() {
      state.mode = state.mode === "academic" ? "industry" : "academic";
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function toggleLang() {
      state.lang = state.lang === "fa" ? "en" : "fa";
      localStorage.setItem("cv-lang", state.lang);
      render();
    }

    function toggleTheme() {
      state.theme = state.theme === "light" ? "dark" : "light";
      localStorage.setItem("cv-theme", state.theme);
      render();
    }

    langBtn.addEventListener("click", toggleLang);
    themeBtn.addEventListener("click", toggleTheme);
    homeBtn.addEventListener("click", goHome);

    /* =========================
       Init
    ========================= */
    render();
  </script>
</body>
</html>
