  <style>
    :root {
      /* Dark & Cold Theme (Default for Landing) */
      --bg: #0a0a0a;
      --surface: #121212;
      --surface-hover: #1e1e1e;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #94a3b8; /* Cold silver/blue */
      --accent-hover: #cbd5e1;
      --border: #262626;
      
      --font-fa: 'Vazirmatn', sans-serif;
      --font-en: 'Inter', sans-serif;
      --radius: 8px;
    }

    [data-theme="light"] {
      --bg: #ffffff;
      --surface: #f8fafc;
      --surface-hover: #f1f5f9;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent: #475569;
      --accent-hover: #1e293b;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font-fa);
      transition: background-color 0.4s ease, color 0.4s ease;
      overflow-x: hidden;
      min-height: 100vh;
    }

    [lang="en"] body { font-family: var(--font-en); }

    /* === Controls (Top Right/Left) === */
    .controls {
      position: fixed;
      top: 20px;
      left: 20px; /* LTR for controls */
      display: flex;
      gap: 12px;
      z-index: 100;
      direction: ltr;
    }

    .btn-icon {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-main);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }
    
    .btn-icon:hover { background: var(--surface-hover); border-color: var(--accent); }

    /* === View Container === */
    .view-section { display: none; width: 100%; min-height: 100vh; }
    .view-section.active { display: block; animation: fadeIn 0.6s ease; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* === 1. LANDING PAGE (16:9 Utilization) === */
    .landing-grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      height: 100vh;
      width: 100vw;
    }

    .landing-image {
      background-image: url('landing.jpg');
      background-size: cover;
      background-position: center;
      filter: grayscale(20%) contrast(110%);
      transition: filter 0.5s ease;
    }

    .landing-image:hover { filter: grayscale(0%) contrast(100%); }

    .landing-content {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 8vw;
      background: var(--bg);
    }

    .landing-name {
      font-size: clamp(2.5rem, 5vw, 4rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 1rem;
      line-height: 1.1;
    }

    .landing-contact {
      font-size: 1rem;
      color: var(--text-muted);
      margin-bottom: 3rem;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .landing-contact a {
      color: inherit;
      text-decoration: none;
      transition: color 0.3s;
    }

    .landing-contact a:hover { color: var(--accent); }

    .landing-actions {
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 300px;
    }

    .btn-minimal {
      background: transparent;
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 16px 24px;
      font-size: 0.9rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .btn-minimal:hover {
      background: var(--text-main);
      color: var(--bg);
      border-color: var(--text-main);
    }

    /* === 2. RESUME PAGES === */
    .resume-wrapper {
      max-width: 1200px;
      margin: 0 auto;
      padding: 80px 24px 60px;
    }

    .resume-header {
      display: flex;
      align-items: center;
      gap: 30px;
      margin-bottom: 50px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 30px;
    }

    .resume-avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--border);
    }

    .resume-title h1 { font-size: 2.2rem; margin-bottom: 8px; letter-spacing: -0.02em; }
    .resume-title p { color: var(--text-muted); font-size: 1rem; line-height: 1.6; }

    .back-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      margin-bottom: 30px;
      transition: color 0.3s;
    }
    .back-btn:hover { color: var(--text-main); }

    .resume-layout {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 60px;
      align-items: start;
    }

    .resume-main { display: flex; flex-direction: column; gap: 40px; }
    .resume-sidebar { display: flex; flex-direction: column; gap: 30px; }

    .section-block { page-break-inside: avoid; }
    
    .section-title {
      font-size: 1.1rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-main);
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }

    .timeline-item { margin-bottom: 24px; }
    .timeline-item:last-child { margin-bottom: 0; }
    
    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 8px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .item-title { font-weight: 600; font-size: 1rem; }
    .item-date { font-size: 0.85rem; color: var(--text-muted); font-family: var(--font-en); }
    .item-subtitle { font-size: 0.9rem; color: var(--accent); margin-bottom: 8px; }
    
    .item-desc { font-size: 0.9rem; color: var(--text-muted); line-height: 1.8; padding-left: 16px; margin: 0; }
    .item-desc li { margin-bottom: 4px; }

    /* MBTI & Glass Stickers */
    .mbti-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      text-align: center;
    }
    .mbti-title { font-size: 0.8rem; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; }
    .mbti-type { font-size: 1.5rem; font-weight: 800; font-family: var(--font-en); color: var(--text-main); letter-spacing: 0.05em; }
    .mbti-desc { font-size: 0.85rem; color: var(--text-muted); margin-top: 8px; line-height: 1.5; }

    .glass-stickers { display: flex; flex-wrap: wrap; gap: 10px; }
    
    .glass-sticker {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-main);
      transition: all 0.3s ease;
    }
    
    [data-theme="light"] .glass-sticker {
      background: rgba(0, 0, 0, 0.03);
      border: 1px solid rgba(0, 0, 0, 0.08);
    }

    .glass-sticker:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--accent);
    }

    /* Skill List */
    .skill-list { display: flex; flex-direction: column; gap: 12px; }
    .skill-item { display: flex; justify-content: space-between; font-size: 0.9rem; }
    .skill-name { color: var(--text-main); font-weight: 500; }
    .skill-level { color: var(--text-muted); font-size: 0.85rem; }

    .about-text { font-size: 0.95rem; color: var(--text-muted); line-height: 1.8; text-align: justify; }

    /* Motivation */
    .motivation-box {
      background: var(--surface);
      padding: 24px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      font-size: 0.95rem;
      line-height: 1.8;
    }
    .motivation-box p { margin-bottom: 12px; color: var(--text-muted); }
    .motivation-box strong { color: var(--text-main); }
    .motivation-box p:last-child { margin-bottom: 0; }

    /* Mobile Responsive */
    @media (max-width: 900px) {
      .landing-grid { grid-template-columns: 1fr; grid-template-rows: 40vh 60vh; }
      .landing-content { padding: 40px 24px; }
      .landing-actions { max-width: 100%; }
      .resume-layout { grid-template-columns: 1fr; gap: 40px; }
      .resume-header { flex-direction: column; text-align: center; gap: 20px; }
      .controls { top: 15px; left: 15px; }
    }

    /* === 3. PRINT LAYOUT (Max 3 Pages) === */
    @media print {
      :root {
        --bg: #ffffff;
        --surface: #ffffff;
        --text-main: #000000;
        --text-muted: #333333;
        --border: #dddddd;
        --accent: #000000;
      }
      
      body { background: white; color: black; font-size: 10pt; }
      .controls, .back-btn, .landing-actions { display: none !important; }
      
      .resume-wrapper { padding: 0; max-width: 100%; }
      .resume-header { margin-bottom: 20px; padding-bottom: 15px; }
      .resume-avatar { width: 80px; height: 80px; }
      .resume-layout { grid-template-columns: 2fr 1fr; gap: 30px; }
      
      .section-title { font-size: 12pt; margin-bottom: 10px; padding-bottom: 5px; }
      .timeline-item { margin-bottom: 12px; page-break-inside: avoid; }
      .item-title { font-size: 10pt; }
      .item-desc { font-size: 9pt; line-height: 1.5; }
      
      .mbti-card { border: 1px solid #ddd; padding: 10px; }
      .glass-sticker { border: 1px solid #ddd; background: none; padding: 4px 8px; font-size: 9pt; }
      .motivation-box { padding: 15px; border: 1px solid #ddd; page-break-inside: avoid; }
      
      /* Force 2 columns for skills in print to save space */
      .skill-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      
      @page { margin: 15mm; size: A4; }
    }
  </style>
</head>

          { title: "Planning & Systems Manager", sub: "Hemiyar Tejarat Fertak", date: "Dec 2022 - Present", desc: ["Documentation and coding", "Process documents and procedures", "Strategic objectives and management reports"] },
          { title: "HR & Insurance Officer", sub: "Hemiyar Tejarat Fertak", date: "Aug 2021 - Present", desc: ["Petty cash and administration", "Supplementary insurance liaison", "Excellence and organizational planning"] },
          { title: "Remote Graphic Designer", sub: "Padeh Airline", date: "2021", desc: ["Banners and stories", "Visual content creation"] },
          { title: "Remote Strategy Officer", sub: "Niroo Holding", date: "2020 - 2021", desc: ["Strategic documents", "Management reports"] },
          { title: "Interior Designer", sub: "Tivan One", date: "2020", desc: ["AutoCAD and Rhino design", "Social media content"] },
          { title: "Graphic Designer", sub: "Soore University", date: "2018 - 2019", desc: ["Poster design"] },
          { title: "Visitor", sub: "Excellenz", date: "2017 - 2018", desc: ["Reception and guidance"] },
          { title: "Design Officer", sub: "Asad Engineering", date: "2015 - 2017", desc: ["Robot part design in AutoCAD"] }
        ],
        achievements: [
          "Bronze Trophy in EFQM assessment",
          "Top writer in 2014 book-reading competition",
          "Designed posters for Soore University",
          "Developed infographic reports for Niroo Holding"
        ],
        courses: [
          "HR & Labor Law (64 hours)",
          "Photoshop (64 hours)",
          "Negotiation Techniques (32 hours)",
          "ISO Internal Audit (32 hours)",
          "ICDL (60 hours)",

        ],
        volunteer: [
          "UNICEF Collaborator",
          "Red Crescent Volunteer",
          "Reporter for Soore University magazine",
          "Environmental clean-up activities"
        ],
        skills: [
          { name: "Microsoft Word", level: "Advanced" },
          { name: "Microsoft Excel", level: "Intermediate" },
          { name: "Microsoft PowerPoint", level: "Advanced" },
          { name: "SPSS", level: "Intermediate" },
          { name: "AutoCAD", level: "Intermediate" },
          { name: "GIS", level: "Intermediate" },
          { name: "Adobe Photoshop", level: "Advanced" },
          { name: "Adobe Illustrator", level: "Beginner" },
          { name: "MS Project", level: "Intermediate" },
          { name: "Power BI", level: "Beginner" },
          { name: "Python / R", level: "Beginner" },
          { name: "Primavera P6", level: "Beginner" }
        ],
        languages: [
          { name: "Persian", level: "Native" },
          { name: "English", level: "Upper-Intermediate" },
          { name: "Turkish", level: "Intermediate" }
        ],
        hobbies: [
          { icon: "🏸", name: "Badminton" },
          { icon: "📸", name: "Photography" },
          { icon: "📚", name: "Reading" },
          { icon: "✍️", name: "Writing" },
          { icon: "🎧", name: "Podcasts" }
        ],
        motivationAcademic: "I am interested in advancing research at the intersection of urban planning and industrial engineering, where spatial analysis and optimization address complex urban challenges. With experience in documentation and knowledge transfer, I can bridge academic research and practical application.",
        motivationIndustry: "I am interested in roles where planning, process analysis, and management reporting support better decisions. By combining data analysis, documentation discipline, and visual communication, I make processes clearer and decisions faster to create sustainable value."
      }
    };

    // --- DOM ELEMENTS ---
    const els = {
      landingView: document.getElementById('landingView'),
      resumeView: document.getElementById('resumeView'),
      langBtn: document.getElementById('langBtn'),
      themeBtn: document.getElementById('themeBtn'),
      resumeAvatar: document.getElementById('resumeAvatar'),
      mainSections: document.getElementById('main-sections'),
      sideSections: document.getElementById('side-sections')
    };

    // --- FUNCTIONS ---
    function updateUI() {
      document.documentElement.lang = state.lang;
      document.documentElement.dir = state.lang === 'fa' ? 'rtl' : 'ltr';
      document.documentElement.setAttribute('data-theme', state.theme);
      
      els.langBtn.innerText = state.lang === 'fa' ? 'EN' : 'FA';
      els.themeBtn.innerText = state.theme === 'dark' ? '☀️' : '🌙';

      const t = translations[state.lang];
      
      // Landing
      document.getElementById('l-name').innerText = t.name;
      document.getElementById('l-phone').innerText = t.phone;
      document.getElementById('l-email').innerText = t.email;
      document.getElementById('btn-academic').innerText = t.btnAcademic;
      document.getElementById('btn-industry').innerText = t.btnIndustry;
      
      // Resume Header
      document.getElementById('r-name').innerText = t.name;
      document.getElementById('r-title').innerText = t.title;
      document.getElementById('btn-back').innerText = t.back;

      // Set Image based on mode
      if (state.mode === 'academic') {
        els.resumeAvatar.src = 'academic.jpg';
      } else {
        els.resumeAvatar.src = 'industry.jpg';
      }

      renderResume();
    }

    function renderResume() {
      const d = data[state.lang];
      const t = translations[state.lang];

      // --- MAIN COLUMN CONTENT ---
      let mainHTML = '';

      // Motivation Letter
      const motivationText = state.mode === 'academic' ? d.motivationAcademic : d.motivationIndustry;
      const motivationTitle = state.mode === 'academic' ? t.sections.motivationAcademic : t.sections.motivationIndustry;
      
      mainHTML += `
        <div class="section-block">
          <h2 class="section-title">${motivationTitle}</h2>
          <div class="motivation-box">
            <p>${motivationText}</p>
          </div>
        </div>
      `;

      // Education (First in Academic, Second in Industry)
      let eduHTML = `
        <div class="section-block">
          <h2 class="section-title">${t.sections.education}</h2>
          ${d.education.map(e => `
            <div class="timeline-item">
              <div class="item-header">
                <span class="item-title">${e.title}</span>
                <span class="item-date">${e.date}</span>
              </div>
              <div class="item-subtitle">${e.sub}</div>
            </div>
          `).join('')}
        </div>
      `;

      // Work Experience
      let workHTML = `
        <div class="section-block">
          <h2 class="section-title">${t.sections.work}</h2>
          ${d.work.map(w => `
            <div class="timeline-item">
              <div class="item-header">
                <span class="item-title">${w.title}</span>
                <span class="item-date">${w.date}</span>
              </div>
              <div class="item-subtitle">${w.sub}</div>
              <ul class="item-desc">
                ${w.desc.map(li => `<li>${li}</li>`).join('')}
              </ul>
            </div>
          `).join('')}
        </div>
      `;

      if (state.mode === 'academic') {
        mainHTML += eduHTML + workHTML;
      } else {
        mainHTML += workHTML + eduHTML;
      }

      // Achievements
      mainHTML += `
        <div class="section-block">
          <h2 class="section-title">${t.sections.achievements}</h2>
          <ul class="item-desc">
            ${d.achievements.map(a => `<li>${a}</li>`).join('')}
          </ul>
        </div>
      `;

      // Courses
      mainHTML += `
        <div class="section-block">
          <h2 class="section-title">${t.sections.courses}</h2>
          <div class="glass-stickers">
            ${d.courses.map(c => `<span class="glass-sticker">📚 ${c}</span>`).join('')}
          </div>
        </div>
      `;

      // --- SIDEBAR CONTENT ---
      let sideHTML = '';

      // About Me
      sideHTML += `
        <div class="section-block">
          <h2 class="section-title">${t.sections.about}</h2>
          <p class="about-text">${d.about}</p>
        </div>
      `;

      // MBTI
      sideHTML += `
        <div class="section-block mbti-card">
          <div class="mbti-title">Personality Type</div>
          <div class="mbti-type">ENTJ</div>
          <div class="mbti-desc">${d.mbti}</div>
        </div>
      `;

      // Skills
      sideHTML += `
        <div class="section-block">
          <h2 class="section-title">${t.sections.skills}</h2>
          <div class="skill-list">
            ${d.skills.map(s => `
              <div class="skill-item">
                <span class="skill-name">${s.name}</span>
                <span class="skill-level">${s.level}</span>
              </div>
            `).join('')}
          </div>
        </div>
      `;

      // Languages
      sideHTML += `
        <div class="section-block">
          <h2 class="section-title">${t.sections.languages}</h2>
          <div class="skill-list">
            ${d.languages.map(l => `
              <div class="skill-item">
                <span class="skill-name">${l.name}</span>
                <span class="skill-level">${l.level}</span>
              </div>
            `).join('')}
          </div>
        </div>
      `;

      // Hobbies (Glass Stickers)
      sideHTML += `
        <div class="section-block">
          <h2 class="section-title">${t.sections.hobbies}</h2>
          <div class="glass-stickers">
            ${d.hobbies.map(h => `
              <span class="glass-sticker">${h.icon} ${h.name}</span>
            `).join('')}
          </div>
        </div>
      `;

      // Volunteer
      sideHTML += `
        <div class="section-block">
          <h2 class="section-title">${t.sections.volunteer}</h2>
          <ul class="item-desc" style="padding-left: 0; list-style-type: none;">
            ${d.volunteer.map(v => `<li style="margin-bottom: 8px;">🌱 ${v}</li>`).join('')}
          </ul>
        </div>
      `;

      // Inject to DOM
      els.mainSections.innerHTML = mainHTML;
      els.sideSections.innerHTML = sideHTML;
    }

    // --- ACTIONS ---
    function openResume(mode) {
      state.mode = mode;
      els.landingView.classList.remove('active');
      els.resumeView.classList.add('active');
      window.scrollTo(0, 0);
      updateUI();
    }

    function goHome() {
      els.resumeView.classList.remove('active');
      els.landingView.classList.add('active');
      window.scrollTo(0, 0);
    }

    function toggleLang() {
      state.lang = state.lang === 'fa' ? 'en' : 'fa';
      updateUI();
    }

    function toggleTheme() {
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      updateUI();
    }

    // Initialize
    updateUI();
  </script>
</body>
</html>
